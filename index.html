<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 劼字 Logo - SVG格式（支持高清屏） -->
    <link rel="icon" type="image/svg+xml" href="/IJX_Platform/favicon.svg" />
    <!-- 备选 PNG 格式（16x16 和 32x32） -->
    <link rel="icon" type="image/png" sizes="32x32" href="/IJX_Platform/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/IJX_Platform/favicon-16.png" />
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/IJX_Platform/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>honey's IJX</title>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
